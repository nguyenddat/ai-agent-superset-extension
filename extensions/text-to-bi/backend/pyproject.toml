[project]
name = "superset-text-to-bi"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.10,<3.11"
# AI framework packages and PII analysis also need to be present in the Superset runtime image.
dependencies = [
    "httpx>=0.27,<1",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "spacy>=3.7,<4",
]

[tool.ruff]
line-length = 120
# Superset 6.1 runs extension backends on Python 3.10.
target-version = "py310"

[tool.ruff.lint]
extend-select = ["E501", "I"]
ignore = ["D100"]

[tool.ruff.lint.per-file-ignores]
# Prompt text is sent to the model as written, so its lines are not wrapped.
"src/text_to_bi/superset_text_to_bi/agent_package/prompts/*.py" = ["E501"]

[tool.apache_superset_extensions.build]
include = [
    "src/text_to_bi/superset_text_to_bi/**/*.py",
    "src/text_to_bi/superset_text_to_bi/**/*.json",
    "src/text_to_bi/superset_text_to_bi/**/*.md",
]
exclude = []
